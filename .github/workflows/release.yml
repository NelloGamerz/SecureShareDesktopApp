name: Release Tauri App

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            config: tauri.linux.conf.json

          - platform: windows-latest
            config: tauri.windows.conf.json

          - platform: macos-latest
            config: tauri.macos.conf.json

    runs-on: ${{ matrix.platform }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target

          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend env
        shell: bash
        run: |
          echo "CLERK KEY EXISTS:"
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "MISSING"
          else
            echo "FOUND"
          fi

          echo "API URL:"
          echo "$VITE_API_BASE_URL"

          echo "APP NAME:"
          echo "$VITE_APP_NAME"
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

      - name: Build frontend
        run: npm run build
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

      - name: Verify frontend output
        shell: bash
        run: |
          echo "Checking dist folder"
          ls -la dist
          find dist -maxdepth 2 -type f

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

        with:
          tagName: ${{ github.ref_name }}

          releaseName: "SecureShare ${{ github.ref_name }}"

          releaseBody: |
            ## SecureShare Release

            Automatic release generated by GitHub Actions.

          releaseDraft: false

          prerelease: false

          args: --config src-tauri/${{ matrix.config }}

  upload-updater:
    needs: release

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Download GitHub release assets

        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |

          mkdir release

          gh release download ${{ github.ref_name }} \
            --dir release



      - name: Check updater metadata

        run: |

          echo "Updater files:"
          find release -type f



      - name: Configure AWS for Cloudflare R2

        uses: aws-actions/configure-aws-credentials@v4

        with:

          aws-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}

          aws-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}

          aws-region: us-east-1


      - name: Upload versioned release files to R2

        run: |

          aws s3 cp release/ \
          s3://${{ secrets.R2_BUCKET_NAME }}/releases/${{ github.ref_name }}/ \
          --recursive \
          --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com



      - name: Upload latest.json to R2 root

        run: |

          aws s3 cp release/latest.json \
          s3://${{ secrets.R2_BUCKET_NAME }}/latest.json \
          --endpoint-url https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
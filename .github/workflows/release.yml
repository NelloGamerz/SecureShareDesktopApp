name: VilSend Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # ============================================================
  # NORMAL RELEASE
  # ============================================================
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            config: tauri.linux.conf.json

          - platform: windows-latest
            config: tauri.windows.conf.json

          - platform: macos-latest
            config: tauri.macos.conf.json

    runs-on: ${{ matrix.platform }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `rust-toolchain.toml` is the only place the Rust version is written
      # down, and it is also where the runner's host target is declared.
      # Reading the pin rather than installing `stable` keeps a release on the
      # same compiler the rest of the repository is tested with.
      # `shell: bash` because this job also runs on `windows-latest`, where
      # `run:` would otherwise be PowerShell and reject the syntax below. bash
      # is present on every GitHub runner.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml declares no channel"; exit 1; }
          rustup toolchain install "$channel"
          rustc --version
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          echo "active toolchain: $active (pinned: $channel)"
          rustup show

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend env
        shell: bash
        run: |
          echo "CLERK KEY EXISTS:"
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "MISSING"
          else
            echo "FOUND"
          fi

          echo "CLERK OAUTH CLIENT ID:"
          if [ -z "$VITE_CLERK_OAUTH_CLIENT_ID" ]; then
            echo "MISSING"
          else
            echo "FOUND"
          fi

          echo "CLERK OAUTH REDIRECT URI:"
          echo "$VITE_CLERK_OAUTH_REDIRECT_URI"

          echo "CLERK OAUTH SCOPES:"
          echo "$VITE_CLERK_OAUTH_SCOPES"

          echo "API URL:"
          echo "$VITE_API_BASE_URL"

          echo "APP NAME:"
          echo "$VITE_APP_NAME"

        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_OAUTH_CLIENT_ID: ${{ secrets.VITE_CLERK_OAUTH_CLIENT_ID }}
          VITE_CLERK_OAUTH_REDIRECT_URI: ${{ secrets.VITE_CLERK_OAUTH_REDIRECT_URI }}
          VITE_CLERK_OAUTH_SCOPES: ${{ secrets.VITE_CLERK_OAUTH_SCOPES }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_OAUTH_CLIENT_ID: ${{ secrets.VITE_CLERK_OAUTH_CLIENT_ID }}
          VITE_CLERK_OAUTH_REDIRECT_URI: ${{ secrets.VITE_CLERK_OAUTH_REDIRECT_URI }}
          VITE_CLERK_OAUTH_SCOPES: ${{ secrets.VITE_CLERK_OAUTH_SCOPES }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

        with:
          tagName: ${{ github.ref_name }}
          releaseName: "VilSend ${{ github.ref_name }}"

          releaseBody: |
            ## VilSend Release

            Automatic release generated by GitHub Actions.

          releaseDraft: false
          prerelease: false

          args: --config crates/desktop/${{ matrix.config }}

  # ============================================================
  # MICROSOFT STORE MSIX BUILD
  #
  # Creates an UNSIGNED MSIX.
  #
  # The MSIX is intended to be uploaded to Microsoft Partner
  # Center, where Microsoft handles Store signing/distribution.
  # ============================================================
  build-windows-store:
    runs-on: windows-latest

    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `rust-toolchain.toml` is the only place the Rust version is written
      # down, and it is also where the runner's host target is declared.
      # Reading the pin rather than installing `stable` keeps a release on the
      # same compiler the rest of the repository is tested with.
      # `shell: bash` because this job also runs on `windows-latest`, where
      # `run:` would otherwise be PowerShell and reject the syntax below. bash
      # is present on every GitHub runner.
      - name: Install the pinned Rust toolchain
        shell: bash
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml declares no channel"; exit 1; }
          rustup toolchain install "$channel"
          rustc --version
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          echo "active toolchain: $active (pinned: $channel)"
          rustup show

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target

          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}-store

          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      # ------------------------------------------------------------
      # BUILD TAURI APPLICATION
      # ------------------------------------------------------------
      - name: Build Windows application
        shell: bash
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_CLERK_OAUTH_CLIENT_ID: ${{ secrets.VITE_CLERK_OAUTH_CLIENT_ID }}
          VITE_CLERK_OAUTH_REDIRECT_URI: ${{ secrets.VITE_CLERK_OAUTH_REDIRECT_URI }}
          VITE_CLERK_OAUTH_SCOPES: ${{ secrets.VITE_CLERK_OAUTH_SCOPES }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

        run: |
          npm run tauri -- build \
            --config crates/desktop/tauri.windows.store.conf.json \
            --no-bundle

      # ------------------------------------------------------------
      # VERIFY EXE
      # ------------------------------------------------------------
      - name: Find VilSend executable
        shell: pwsh
        run: |
          Write-Host "=== Searching for VilSend.exe ==="

          $exe = Get-ChildItem `
            "target/release" `
            -Filter "VilSend.exe" `
            -Recurse `
            -File |
            Select-Object -First 1

          if (-not $exe) {
            Write-Error "VilSend.exe was not found."
            exit 1
          }

          Write-Host ""
          Write-Host "Found:"
          Write-Host $exe.FullName

          Write-Host ""
          Write-Host "Size:"
          Write-Host "$($exe.Length) bytes"

          "VILSEND_EXE=$($exe.FullName)" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # GET VERSION FROM GIT TAG
      #
      # v1.2.3 -> 1.2.3.0
      # ------------------------------------------------------------
      - name: Calculate MSIX version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"

          if (-not $tag.StartsWith("v")) {
            Write-Error "Release tag must start with v. Example: v1.2.3"
            exit 1
          }

          $version = $tag.Substring(1)

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "Release tag must use semantic versioning such as v1.2.3"
            exit 1
          }

          $msixVersion = "$version.0"

          Write-Host "Git tag:"
          Write-Host $tag

          Write-Host ""
          Write-Host "MSIX version:"
          Write-Host $msixVersion

          "MSIX_VERSION=$msixVersion" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # PREPARE MSIX DIRECTORY
      # ------------------------------------------------------------
      - name: Prepare MSIX package directory
        shell: pwsh
        run: |
          $packageRoot = Join-Path $PWD "msix-package"
          $assetsRoot = Join-Path $packageRoot "Assets"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $packageRoot | Out-Null

          New-Item `
            -ItemType Directory `
            -Force `
            -Path $assetsRoot | Out-Null

          Write-Host "MSIX package directory:"
          Write-Host $packageRoot

          "MSIX_PACKAGE_ROOT=$packageRoot" >> $env:GITHUB_ENV
          "MSIX_ASSETS_ROOT=$assetsRoot" >> $env:GITHUB_ENV

      # ------------------------------------------------------------
      # COPY APPLICATION
      # ------------------------------------------------------------
      - name: Copy VilSend executable
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "$env:VILSEND_EXE")) {
            Write-Error "VilSend.exe does not exist."
            exit 1
          }

          Copy-Item `
            -LiteralPath "$env:VILSEND_EXE" `
            -Destination "$env:MSIX_PACKAGE_ROOT\VilSend.exe" `
            -Force

          Write-Host "Copied VilSend.exe"

      # ------------------------------------------------------------
      # COPY APP MANIFEST
      #
      # SOURCE:
      # crates/desktop/msix/AppManifest.xml
      #
      # DESTINATION:
      # msix-package/AppxManifest.xml
      # ------------------------------------------------------------
      - name: Prepare AppxManifest.xml
        shell: pwsh
        run: |
          $manifestSource = Join-Path $PWD "crates\desktop\msix\AppManifest.xml"
          $manifestDestination = Join-Path $env:MSIX_PACKAGE_ROOT "AppxManifest.xml"

          Write-Host "Manifest source:"
          Write-Host $manifestSource

          Write-Host ""
          Write-Host "Manifest destination:"
          Write-Host $manifestDestination

          if (-not (Test-Path -LiteralPath $manifestSource)) {
            Write-Error "AppManifest.xml was not found at:"
            Write-Error $manifestSource

            Write-Host ""
            Write-Host "Searching repository for AppManifest.xml..."

            Get-ChildItem `
              -Path $PWD `
              -Recurse `
              -Filter "AppManifest.xml" `
              -File |
              ForEach-Object {
                Write-Host "Found:"
                Write-Host $_.FullName
              }

            exit 1
          }

          Copy-Item `
            -LiteralPath $manifestSource `
            -Destination $manifestDestination `
            -Force

          Write-Host ""
          Write-Host "Copied AppManifest.xml successfully."

          # --------------------------------------------------------
          # UPDATE PACKAGE VERSION
          # --------------------------------------------------------
          [xml]$manifest = Get-Content `
            -LiteralPath $manifestDestination `
            -Raw

          $identity = $manifest.Package.Identity

          if (-not $identity) {
            Write-Error "Could not find Package/Identity in AppManifest.xml"
            exit 1
          }

          $identity.Version = "$env:MSIX_VERSION"

          $manifest.Save(
            (Resolve-Path -LiteralPath $manifestDestination)
          )

          Write-Host ""
          Write-Host "Updated MSIX version to:"
          Write-Host $env:MSIX_VERSION

      # ------------------------------------------------------------
      # COPY STORE ICONS
      # ------------------------------------------------------------
      - name: Prepare MSIX Store assets
        shell: pwsh
        run: |
          $iconRoot = Join-Path $PWD "crates\desktop\icons"
          $assetsRoot = "$env:MSIX_ASSETS_ROOT"

          if (-not (Test-Path -LiteralPath $iconRoot)) {
            Write-Error "Icon directory not found:"
            Write-Error $iconRoot
            exit 1
          }

          Write-Host "Available icons:"
          Get-ChildItem -LiteralPath $iconRoot -File |
            Select-Object Name, Length |
            Format-Table -AutoSize

          # --------------------------------------------------------
          # StoreLogo.png
          # --------------------------------------------------------
          $storeLogoCandidates = @(
            "store-logo.png",
            "StoreLogo.png",
            "store_logo.png"
          )

          $storeLogo = $null

          foreach ($candidate in $storeLogoCandidates) {
            $candidatePath = Join-Path $iconRoot $candidate

            if (Test-Path -LiteralPath $candidatePath) {
              $storeLogo = $candidatePath
              break
            }
          }

          # --------------------------------------------------------
          # Square150x150Logo.png
          # --------------------------------------------------------
          $square150Candidates = @(
            "Square150x150Logo.png",
            "square150x150Logo.png",
            "150x150.png",
            "icon-150.png"
          )

          $square150 = $null

          foreach ($candidate in $square150Candidates) {
            $candidatePath = Join-Path $iconRoot $candidate

            if (Test-Path -LiteralPath $candidatePath) {
              $square150 = $candidatePath
              break
            }
          }

          # --------------------------------------------------------
          # Square44x44Logo.png
          # --------------------------------------------------------
          $square44Candidates = @(
            "Square44x44Logo.png",
            "square44x44Logo.png",
            "44x44.png",
            "icon-44.png"
          )

          $square44 = $null

          foreach ($candidate in $square44Candidates) {
            $candidatePath = Join-Path $iconRoot $candidate

            if (Test-Path -LiteralPath $candidatePath) {
              $square44 = $candidatePath
              break
            }
          }

          if (-not $storeLogo) {
            Write-Error "StoreLogo.png was not found in crates/desktop/icons."
            exit 1
          }

          if (-not $square150) {
            Write-Error "Square150x150Logo.png was not found in crates/desktop/icons."
            exit 1
          }

          if (-not $square44) {
            Write-Error "Square44x44Logo.png was not found in crates/desktop/icons."
            exit 1
          }

          Copy-Item `
            -LiteralPath $storeLogo `
            -Destination "$assetsRoot\StoreLogo.png" `
            -Force

          Copy-Item `
            -LiteralPath $square150 `
            -Destination "$assetsRoot\Square150x150Logo.png" `
            -Force

          Copy-Item `
            -LiteralPath $square44 `
            -Destination "$assetsRoot\Square44x44Logo.png" `
            -Force

          Write-Host ""
          Write-Host "MSIX assets prepared:"

          Get-ChildItem `
            -LiteralPath $assetsRoot |
            Select-Object Name, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # SHOW PACKAGE CONTENT
      # ------------------------------------------------------------
      - name: Inspect MSIX package contents
        shell: pwsh
        run: |
          Write-Host "=== MSIX PACKAGE ==="
          Write-Host ""

          Get-ChildItem `
            -LiteralPath "$env:MSIX_PACKAGE_ROOT" `
            -Recurse `
            -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

      # ------------------------------------------------------------
      # MAKEAPPX
      #
      # IMPORTANT:
      # NO SIGNING HAPPENS HERE.
      # ------------------------------------------------------------
      - name: Create unsigned MSIX
        shell: pwsh
        run: |
          $makeAppx = Get-Command MakeAppx.exe `
            -ErrorAction SilentlyContinue

          if (-not $makeAppx) {
            $makeAppxCandidates = @(
              "$env:ProgramFiles(x86)\Windows Kits\10\App Certification Kit\MakeAppx.exe",
              "$env:ProgramFiles(x86)\Windows Kits\10\bin\x64\MakeAppx.exe",
              "$env:ProgramFiles(x86)\Windows Kits\10\bin\10.0.26100.0\x64\MakeAppx.exe"
            )

            foreach ($candidate in $makeAppxCandidates) {
              if (Test-Path -LiteralPath $candidate) {
                $makeAppx = Get-Item -LiteralPath $candidate
                break
              }
            }
          }

          if (-not $makeAppx) {
            Write-Error "MakeAppx.exe was not found."
            exit 1
          }

          Write-Host "Using MakeAppx:"
          Write-Host $makeAppx.Source

          $output = Join-Path `
            $PWD `
            "store-package\VilSend_$env:MSIX_VERSION`_x64.msix"

          New-Item `
            -ItemType Directory `
            -Force `
            -Path "store-package" | Out-Null

          & $makeAppx.Source pack `
            /d "$env:MSIX_PACKAGE_ROOT" `
            /p "$output" `
            /o

          if ($LASTEXITCODE -ne 0) {
            Write-Error "MakeAppx failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }

          if (-not (Test-Path -LiteralPath $output)) {
            Write-Error "MSIX was not created."
            exit 1
          }

          Write-Host ""
          Write-Host "============================================"
          Write-Host "UNSIGNED MSIX CREATED"
          Write-Host "============================================"
          Write-Host ""
          Write-Host $output
          Write-Host ""

          Get-Item -LiteralPath $output |
            Select-Object FullName, Length |
            Format-List

      # ------------------------------------------------------------
      # VERIFY MSIX
      # ------------------------------------------------------------
      - name: Verify MSIX package
        shell: pwsh
        run: |
          $msix = Get-ChildItem `
            "store-package" `
            -Filter "*.msix" `
            -File

          if ($msix.Count -ne 1) {
            Write-Error "Expected exactly one MSIX. Found $($msix.Count)."

            $msix |
              ForEach-Object {
                Write-Host $_.FullName
              }

            exit 1
          }

          Write-Host "Exactly one MSIX found:"
          Write-Host $msix[0].FullName

          Write-Host ""
          Write-Host "MSIX package:"

          Get-Item -LiteralPath $msix[0].FullName |
            Select-Object Name, Length |
            Format-List

      # ------------------------------------------------------------
      # UPLOAD GITHUB ARTIFACT
      # ------------------------------------------------------------
      - name: Upload Microsoft Store MSIX
        uses: actions/upload-artifact@v4
        with:
          name: windows-store-msix
          path: store-package/*.msix
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # UPLOAD MICROSOFT STORE MSIX TO R2
  # ============================================================
  upload-windows-store-to-r2:
    needs: build-windows-store

    runs-on: ubuntu-latest

    steps:
      - name: Download Microsoft Store MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-store-msix
          path: ./store-package/

      - name: Display Store package
        run: |
          echo "Microsoft Store MSIX package:"
          echo "--------------------------------"

          ls -lah store-package/

          echo "--------------------------------"

      - name: Verify exactly one MSIX
        shell: bash
        run: |
          MSIX_COUNT=$(find store-package \
            -maxdepth 1 \
            -type f \
            -name "*.msix" |
            wc -l)

          if [ "$MSIX_COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly one MSIX."
            echo "Found: $MSIX_COUNT"

            find store-package \
              -maxdepth 1 \
              -type f \
              -print

            exit 1
          fi

          echo "Exactly one MSIX found."

      - name: Configure Cloudflare R2 credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"

      - name: Configure R2 endpoint
        run: |
          echo "R2_ENDPOINT=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Upload Microsoft Store MSIX to R2
        shell: bash
        run: |
          MSIX_FILE=$(find store-package \
            -maxdepth 1 \
            -type f \
            -name "*.msix" |
            head -n 1)

          MSIX_NAME=$(basename "$MSIX_FILE")

          echo "MSIX file:"
          echo "$MSIX_FILE"

          echo ""
          echo "MSIX name:"
          echo "$MSIX_NAME"

          echo ""
          echo "Release tag:"
          echo "${{ github.ref_name }}"

          echo ""
          echo "Uploading to:"
          echo "s3://${{ secrets.R2_BUCKET }}/store/${{ github.ref_name }}/${MSIX_NAME}"

          aws s3 cp \
            "$MSIX_FILE" \
            "s3://${{ secrets.R2_BUCKET }}/store/${{ github.ref_name }}/${MSIX_NAME}" \
            --content-type "application/msix" \
            --cache-control "public, max-age=31536000, immutable" \
            --endpoint-url "$R2_ENDPOINT"

          echo ""
          echo "Microsoft Store MSIX uploaded successfully."

      - name: Show Microsoft Store MSIX URL
        shell: bash
        run: |
          MSIX_FILE=$(find store-package \
            -maxdepth 1 \
            -type f \
            -name "*.msix" |
            head -n 1)

          MSIX_NAME=$(basename "$MSIX_FILE")

          echo ""
          echo "============================================================"
          echo "MICROSOFT STORE MSIX"
          echo "============================================================"
          echo ""
          echo "Filename:"
          echo "$MSIX_NAME"
          echo ""
          echo "Download URL:"
          echo "https://update.vilsend.in/store/${{ github.ref_name }}/${MSIX_NAME}"
          echo ""
          echo "============================================================"
          echo ""
          echo "This MSIX is UNSIGNED."
          echo ""
          echo "Download it and submit it manually through"
          echo "Microsoft Partner Center."
          echo ""
          echo "Microsoft Store will handle Store signing."
          echo ""
          echo "============================================================"

  # ============================================================
  # NORMAL TAURI UPDATER / R2 UPLOAD
  # ============================================================
  upload-updater:
    needs: release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          mkdir -p release

          gh release download "${{ github.ref_name }}" \
            --dir release

      - name: Check downloaded files
        run: |
          echo "Downloaded release files:"
          echo "--------------------------------"

          find release -maxdepth 1 -type f -printf '%f\n' | sort

          echo "--------------------------------"

      - name: Verify latest.json exists
        run: |
          if [ ! -f "release/latest.json" ]; then
            echo "ERROR: latest.json was not found!"
            exit 1
          fi

          echo "latest.json found."

      - name: Rewrite updater URLs for R2
        env:
          RELEASE_TAG: ${{ github.ref_name }}

        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("release/latest.json")

          release_tag = os.environ["RELEASE_TAG"]
          base_url = "https://update.vilsend.in"

          print("Reading:", path)

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("Original updater URLs:")
          print("--------------------------------")

          for platform, info in data.get("platforms", {}).items():
              url = info.get("url")

              if not url:
                  print(f"{platform}: NO URL")
                  continue

              print(f"{platform}: {url}")

          print("")
          print("Rewriting URLs:")
          print("--------------------------------")

          for platform, info in data.get("platforms", {}).items():
              url = info.get("url")

              if not url:
                  continue

              filename = url.split("/")[-1]

              new_url = (
                  f"{base_url}/releases/"
                  f"{release_tag}/"
                  f"{filename}"
              )

              info["url"] = new_url

              print(f"{platform}:")
              print(f"  {new_url}")

          with path.open("w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("")
          print("latest.json successfully updated.")
          PY

      - name: Show final latest.json
        run: |
          echo "Final latest.json:"
          echo "================================"

          cat release/latest.json

          echo "================================"

      - name: Configure Cloudflare R2 credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"

      - name: Configure R2 endpoint
        run: |
          echo "R2_ENDPOINT=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Upload versioned release files to R2
        run: |
          echo "Uploading release files to:"
          echo "s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/"

          aws s3 cp release/ \
            "s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT"

      - name: Upload latest.json to R2
        run: |
          echo "Uploading latest.json..."

          aws s3 cp release/latest.json \
            "s3://${{ secrets.R2_BUCKET }}/latest.json" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --endpoint-url "$R2_ENDPOINT"

          echo "latest.json uploaded successfully."

      - name: Verify R2 updater URL
        run: |
          echo "Updater endpoint:"
          echo "https://update.vilsend.in/latest.json"

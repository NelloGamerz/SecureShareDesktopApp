name: VilSend Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            config: tauri.linux.conf.json

          - platform: windows-latest
            config: tauri.windows.conf.json

          - platform: macos-latest
            config: tauri.macos.conf.json

    runs-on: ${{ matrix.platform }}

    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target

          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt update
          sudo apt install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Check frontend env
        shell: bash
        run: |
          echo "CLERK KEY EXISTS:"
          if [ -z "$VITE_CLERK_PUBLISHABLE_KEY" ]; then
            echo "MISSING"
          else
            echo "FOUND"
          fi

          echo "API URL:"
          echo "$VITE_API_BASE_URL"

          echo "APP NAME:"
          echo "$VITE_APP_NAME"

        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v1

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}

        with:
          tagName: ${{ github.ref_name }}

          releaseName: "VilSend ${{ github.ref_name }}"

          releaseBody: |
            ## VilSend Release

            Automatic release generated by GitHub Actions.

          releaseDraft: false

          prerelease: false

          args: --config src-tauri/${{ matrix.config }}


  upload-updater:
    needs: release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          mkdir -p release

          gh release download "${{ github.ref_name }}" \
            --dir release

      - name: Check downloaded files
        run: |
          echo "Downloaded release files:"
          echo "--------------------------------"

          find release -maxdepth 1 -type f -printf '%f\n' | sort

          echo "--------------------------------"

      - name: Verify latest.json exists
        run: |
          if [ ! -f "release/latest.json" ]; then
            echo "ERROR: latest.json was not found!"
            exit 1
          fi

          echo "latest.json found."

      - name: Rewrite updater URLs for R2
        env:
          RELEASE_TAG: ${{ github.ref_name }}

        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("release/latest.json")

          release_tag = os.environ["RELEASE_TAG"]
          base_url = "https://update.vilsend.in"

          print("Reading:", path)

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("Original updater URLs:")
          print("--------------------------------")

          for platform, info in data.get("platforms", {}).items():
              url = info.get("url")

              if not url:
                  print(f"{platform}: NO URL")
                  continue

              print(f"{platform}: {url}")

          print("")
          print("Rewriting URLs:")
          print("--------------------------------")

          for platform, info in data.get("platforms", {}).items():
              url = info.get("url")

              if not url:
                  continue

              filename = url.split("/")[-1]

              new_url = (
                  f"{base_url}/releases/"
                  f"{release_tag}/"
                  f"{filename}"
              )

              info["url"] = new_url

              print(f"{platform}:")
              print(f"  {new_url}")

          with path.open("w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("")
          print("latest.json successfully updated.")
          PY

      - name: Show final latest.json
        run: |
          echo "Final latest.json:"
          echo "================================"

          cat release/latest.json

          echo "================================"

      - name: Configure Cloudflare R2 credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"

      - name: Configure R2 endpoint
        run: |
          echo "R2_ENDPOINT=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Upload versioned release files to R2
        run: |
          echo "Uploading release files to:"
          echo "s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/"

          aws s3 cp release/ \
            "s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT"

      - name: Upload latest.json to R2
        run: |
          echo "Uploading latest.json..."

          aws s3 cp release/latest.json \
            "s3://${{ secrets.R2_BUCKET }}/latest.json" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --endpoint-url "$R2_ENDPOINT"

          echo "latest.json uploaded successfully."

      - name: Verify R2 updater URL
        run: |
          echo "Updater endpoint:"
          echo "https://update.vilsend.in/latest.json"
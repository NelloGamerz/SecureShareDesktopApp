  build-windows-store:
    runs-on: windows-latest

    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target

          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}-store

          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri App for Microsoft Store
        shell: bash
        env:
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_APP_NAME: ${{ secrets.VITE_APP_NAME }}
        run: |
          npm run tauri -- build \
            --config src-tauri/tauri.windows.store.conf.json \
            --no-bundle

      # - name: Verify Tauri executable
      #   shell: bash
      #   run: |
      #     echo "Searching for VilSend.exe..."

      #     find src-tauri/target \
      #       -type f \
      #       -name "VilSend.exe" \
      #       -print

      #     if ! find src-tauri/target \
      #       -type f \
      #       -name "VilSend.exe" \
      #       -print -quit | grep -q .; then

      #       echo "ERROR: VilSend.exe was not found"
      #       exit 1
      #     fi

      - name: Inspect Tauri build output
        shell: pwsh
        run: |
          Write-Host "=== Tauri target/release ==="

          if (-not (Test-Path "src-tauri/target/release")) {
            Write-Error "src-tauri/target/release does not exist."
            exit 1
          }

          Get-ChildItem `
            "src-tauri/target/release" `
            -Recurse `
            -File |
            Select-Object FullName, Length |
            Format-Table -AutoSize

          Write-Host ""
          Write-Host "=== EXE files ==="

          $exes = Get-ChildItem `
            "src-tauri/target/release" `
            -Filter "*.exe" `
            -Recurse `
            -File

          if (-not $exes) {
            Write-Error "No executable was generated."
            exit 1
          }

          foreach ($exe in $exes) {
            Write-Host "EXE: $($exe.FullName)"
            Write-Host "SIZE: $($exe.Length)"
          }

      - name: Show build output
        shell: bash
        run: |
          find src-tauri/target/release \
            -maxdepth 3 \
            -type f \
            -print

  publish-windows-store:
    needs: build-windows-store
    runs-on: ubuntu-latest
    if: ${{ false }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-store-msix
          path: ./store-package/

      - name: Display downloaded files
        run: |
          echo "Store package contents:"
          ls -lah store-package/ || echo "No artifacts found"

      - name: |
          Publish to Microsoft Store
          (Requires Partner Center credentials - currently disabled)
        run: |
          echo "To enable Microsoft Store publishing:"
          echo "1. Set up Microsoft Store Partner Center account"
          echo "2. Configure GitHub secrets:"
          echo "   - MS_STORE_TENANT_ID"
          echo "   - MS_STORE_CLIENT_ID"
          echo "   - MS_STORE_CLIENT_SECRET"
          echo "3. Change 'if' condition to 'if: github.event_name == \"push\"'"
          echo "4. Update this step with actual Partner Center submission"

  upload-updater:
    needs: release

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download GitHub release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

        run: |
          mkdir -p release

          gh release download "${{ github.ref_name }}" \
            --dir release

      - name: Check downloaded files
        run: |
          echo "Downloaded release files:"
          echo "--------------------------------"

          find release -maxdepth 1 -type f -printf '%f\n' | sort

          echo "--------------------------------"

      - name: Verify latest.json exists
        run: |
          if [ ! -f "release/latest.json" ]; then
            echo "ERROR: latest.json was not found!"
            exit 1
          fi

          echo "latest.json found."

      - name: Rewrite updater URLs for R2
        env:
          RELEASE_TAG: ${{ github.ref_name }}

        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("release/latest.json")

          release_tag = os.environ["RELEASE_TAG"]
          base_url = "https://update.vilsend.in"

          print("Reading:", path)

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          print("")
          print("Original updater URLs:")
          print("--------------------------------")

          for platform, info in data.get("platforms", {}).items():
              url = info.get("url")

              if not url:
                  print(f"{platform}: NO URL")
                  continue

              print(f"{platform}: {url}")

          print("")
          print("Rewriting URLs:")
          print("--------------------------------")

          for platform, info in data.get("platforms", {}).items():
              url = info.get("url")

              if not url:
                  continue

              filename = url.split("/")[-1]

              new_url = (
                  f"{base_url}/releases/"
                  f"{release_tag}/"
                  f"{filename}"
              )

              info["url"] = new_url

              print(f"{platform}:")
              print(f"  {new_url}")

          with path.open("w", encoding="utf-8") as f:
              json.dump(data, f, indent=2)
              f.write("\n")

          print("")
          print("latest.json successfully updated.")
          PY

      - name: Show final latest.json
        run: |
          echo "Final latest.json:"
          echo "================================"

          cat release/latest.json

          echo "================================"

      - name: Configure Cloudflare R2 credentials
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}" >> "$GITHUB_ENV"
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}" >> "$GITHUB_ENV"
          echo "AWS_DEFAULT_REGION=auto" >> "$GITHUB_ENV"

      - name: Configure R2 endpoint
        run: |
          echo "R2_ENDPOINT=https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" >> "$GITHUB_ENV"

      - name: Upload versioned release files to R2
        run: |
          echo "Uploading release files to:"
          echo "s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/"

          aws s3 cp release/ \
            "s3://${{ secrets.R2_BUCKET }}/releases/${{ github.ref_name }}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT"

      - name: Upload latest.json to R2
        run: |
          echo "Uploading latest.json..."

          aws s3 cp release/latest.json \
            "s3://${{ secrets.R2_BUCKET }}/latest.json" \
            --content-type "application/json" \
            --cache-control "no-cache, no-store, must-revalidate" \
            --endpoint-url "$R2_ENDPOINT"

          echo "latest.json uploaded successfully."

      - name: Verify R2 updater URL
        run: |
          echo "Updater endpoint:"
          echo "https://update.vilsend.in/latest.json"

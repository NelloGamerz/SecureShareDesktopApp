name: CI

on:
  push:
    branches: [main, dev, "phase-*"]
  pull_request:

# A new push to the same ref supersedes the previous run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ============================================================
  # ARCHITECTURE LINT
  #
  # The dependency direction in ADR-0002 is the whole reason the workspace
  # exists, so it is asserted rather than left to review. `vilsend-core` is
  # the domain layer: nothing that reaches a shell, a socket, a database or
  # an OS keychain may appear in its dependency tree.
  # ============================================================
  architecture:
    name: Architecture lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `rust-toolchain.toml` is the only place the Rust version is written
      # down. Installing `stable` would put this job on a different compiler
      # from the one the repository pins, and `rustup` would then download the
      # pinned one anyway on first use — so read the pin and install that.
      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml declares no channel"; exit 1; }
          rustup toolchain install "$channel"
          # Running a shim inside the repository is what makes rustup apply the
          # file: it installs the pinned channel plus the components and targets
          # declared there.
          rustc --version
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          echo "active toolchain: $active (pinned: $channel)"
          case "$active" in
            "$channel"*) ;;
            *) echo "::error::active toolchain $active is not the pinned $channel"; exit 1 ;;
          esac

      # Printed on every run so a failure is diagnosable from the log alone.
      # `--prefix none` prints one bare `name version` line per crate, which is
      # what makes the anchored pattern below match package names rather than
      # substrings of them.
      - name: Print the dependency tree of vilsend-core
        run: cargo tree -p vilsend-core --prefix none

      # Negated on purpose: a bare `grep` exits 0 when it finds a match, so the
      # un-negated form would pass the lint exactly when it should fail, and
      # fail it when there is nothing to report. The `!` inverts that.
      #
      # It is the only command in this step, and therefore the last one, which
      # is what makes the step's exit status the lint's verdict — bash's
      # `set -e` deliberately does not abort on a negated command.
      - name: vilsend-core must not depend on a shell or an adapter
        run: "! cargo tree -p vilsend-core --prefix none | grep -E '^(tauri|reqwest|axum|sqlx|keyring)( |$)'"

      # Guards the guard: without this, the lint above would also pass if the
      # crate had left the workspace and `cargo tree` resolved nothing.
      - name: vilsend-core must still be in the workspace
        run: cargo tree -p vilsend-core --prefix none | grep -q '^vilsend-core '

  # ============================================================
  # FRONTEND
  #
  # Type-check, IPC contract check, and a production build. The build is not
  # only a gate in its own right: the Rust job needs `dist/`, because
  # `tauri::generate_context!` embeds the frontend at compile time.
  # ============================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      # Every `invoke(...)` in the frontend must name a command that is
      # registered in `generate_handler!`, and vice versa. Phase 1 built this
      # script; this is the first PR gate it has.
      - name: IPC contract
        run: npm run check:ipc

      # ------------------------------------------------------------
      # TAURI PROJECT RESOLUTION
      #
      # `tauri-cli` looks for the project in the current directory and in
      # `./src-tauri`, then falls back to a walk of the current directory
      # bounded by `TAURI_CLI_CONFIG_DEPTH` (default 3) that does *not* honour
      # `.gitignore`. The fallback is the only reason `crates/desktop` is found,
      # and it fails quietly: with no project in reach, `tauri info` prints an
      # empty App section and still exits 0 — verified locally, where
      # `TAURI_CLI_CONFIG_DEPTH=1` produces exactly that. So the assertion is on
      # the resolved value, not on the exit code.
      #
      # Run before anything invokes cargo, so `target/` does not exist and
      # cannot contribute noise to the count below.
      # ------------------------------------------------------------
      - name: tauri-cli must resolve crates/desktop
        run: |
          resolved=$(npx tauri info | sed -n 's/^    - frontendDist: //p')
          expected=$(node -p "require('./crates/desktop/tauri.conf.json').build.frontendDist")

          echo "tauri-cli resolved frontendDist = '${resolved:-<nothing>}'"
          echo "crates/desktop/tauri.conf.json declares '$expected'"

          if [ "$resolved" != "$expected" ]; then
            echo "::error::tauri-cli did not resolve crates/desktop/tauri.conf.json"
            echo "An empty value means it resolved no project at all: the fallback"
            echo "walk is bounded by TAURI_CLI_CONFIG_DEPTH (default 3), and"
            echo "crates/desktop sits at depth 2. Lowering it hides the project"
            echo "instead of failing, so do not."
            exit 1
          fi

      - name: exactly one tauri.conf.json within the CLI's search depth
        run: |
          found=$(find . -maxdepth 3 -name 'tauri.conf.json' | sort)
          echo "within depth 3:"
          printf '%s\n' "$found"

          outside=$(printf '%s\n' "$found" | grep -v '^\./node_modules/' | grep . || true)
          count=$(printf '%s\n' "$outside" | grep -c . || true)

          if [ "$count" -ne 1 ] || [ "$outside" != "./crates/desktop/tauri.conf.json" ]; then
            echo "::error::expected exactly ./crates/desktop/tauri.conf.json within depth 3"
            echo "A second config file inside the walk can capture resolution."
            exit 1
          fi

          # The walk does not skip `node_modules`, so this half cannot be a hard
          # failure — any dependency is free to ship a config file — but it is
          # the half that would actually capture resolution, so it is reported.
          inside=$(printf '%s\n' "$found" | grep '^\./node_modules/' || true)
          if [ -n "$inside" ]; then
            echo "::warning::a tauri.conf.json sits under node_modules, which the walk does not skip:"
            printf '%s\n' "$inside"
          fi

      - name: Build
        run: npm run build

      - name: Upload the frontend build for the Rust job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ============================================================
  # RUST
  # ============================================================
  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the frontend build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # Same as the architecture job: the pin in `rust-toolchain.toml` decides
      # the compiler, and it brings `rustfmt` and `clippy` with it.
      - name: Install the pinned Rust toolchain
        run: |
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel" || { echo "::error::rust-toolchain.toml declares no channel"; exit 1; }
          rustup toolchain install "$channel"
          rustc --version
          active=$(rustup show active-toolchain | cut -d' ' -f1)
          echo "active toolchain: $active (pinned: $channel)"
          case "$active" in
            "$channel"*) ;;
            *) echo "::error::active toolchain $active is not the pinned $channel"; exit 1 ;;
          esac

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # ---> ADD PUBLIC API STEPS HERE <---
      - name: Install nightly toolchain (for public-api)
        run: rustup toolchain install nightly --profile minimal

      - name: Install cargo-public-api
        run: cargo install cargo-public-api --locked

      - name: Check public API of crates/sdk
        run: cargo +nightly public-api --manifest-path crates/sdk/Cargo.toml -ss > /tmp/public-api.txt
      # -----------------------------------

      - name: Formatting
        run: cargo fmt --all --check

      # Linted and tested in both feature configurations, because neither is a
      # subset of the other. `protocol-v2` is off in every shipped build and on
      # in every v2 build, so a warning, a compile error or a failing test in
      # either one is invisible from the other — and the v2 crypto is not
      # compiled at all without the flag, which would silently skip the vectors,
      # the tamper tests and the wire-compatibility fixture.
      #
      # `06-testing-and-quality.md` §6.2 names `--all-features` for this.
      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (default features)
        run: cargo test --workspace

      - name: Tests (all features)
        run: cargo test --workspace --all-features

      # The wire-compatibility floor (ADR-0010; `06-testing-and-quality.md`
      # §6.2). It already runs inside the `--all-features` pass above; it is
      # named separately because it is the one suite whose failure means the
      # installed base is broken, and that should be legible without reading
      # the whole log.
      #
      # `--features protocol-v2` is what makes it an assertion rather than a
      # formality: with the v2 wire compiled in, this proves the build still
      # speaks v1 to a v1 receiver. Every later Phase 4 sub-phase must keep
      # this green.
      - name: Wire compatibility against the pinned v1 receiver
        run: cargo test -p vilsend --test compat_v1 --features protocol-v2

      # The desktop shell is a consumer of `vilsend-sdk`, and of nothing below
      # it (`05-migration-plan.md`, Phase 5 acceptance: "The desktop app has no
      # direct dependency on `vilsend-engine` — only on `vilsend-sdk`").
      #
      # **This passes vacuously today.** `vilsend-engine` does not exist:
      # Phase 3 has not run, and `crates/` holds `core`, `sdk` and `desktop`.
      # The lint is here now so that the day the engine appears, the desktop
      # crate is already held to the rule rather than the rule being remembered
      # afterwards. It is the same negated form as the architecture lint above,
      # and for the same reason — a bare `grep` passes exactly when it should
      # fail.
      - name: The desktop crate must not depend on the engine
        run: "! cargo tree -p vilsend --prefix none | grep -E '^vilsend-engine( |$)'"

      # Guards the guard, as above: `cargo tree -p vilsend` resolving nothing
      # would satisfy the lint for the wrong reason.
      - name: vilsend must still be in the workspace
        run: cargo tree -p vilsend --prefix none | grep -q '^vilsend '

  # ============================================================
  # PUBLIC API
  #
  # `vilsend-sdk` is the semver-stable surface (ADR-0005, `04` §2.5), and two
  # things about it are asserted rather than reviewed:
  #
  #   * a committed snapshot of the public API, diffed byte for byte, so that an
  #     accidental change is visible in a review diff rather than in a
  #     consumer's build;
  #   * `cargo-semver-checks` against the last revision that had the crate, so a
  #     change that IS breaking fails here rather than being discovered after
  #     someone pinned it.
  #
  # Both need nightly: they read rustdoc's JSON, which is nightly-only. That is
  # why this is its own job instead of a step in `rust`, which runs the pinned
  # stable for everything else and must keep doing so.
  # ============================================================
  public-api:
    name: Public API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The whole history, because the baseline below is a revision that is
      # already on the target branch. A depth-1 checkout turns "there is no
      # baseline" into "the baseline is missing", which are different answers.
      - name: Checkout the history
        run: git fetch --no-tags --prune --unshallow || git fetch --no-tags --prune --depth=200

      # Pinned by date, not `nightly`. Rustdoc's JSON format moves between
      # nightlies, so an unpinned toolchain makes the committed snapshot depend
      # on when CI happened to run — which is not a snapshot.
      - name: Install a pinned nightly for rustdoc JSON
        run: rustup toolchain install nightly-2026-09-19 --profile minimal

      - name: Install cargo-public-api and cargo-semver-checks
        run: |
          cargo install cargo-public-api --locked
          cargo install cargo-semver-checks --locked

      # The snapshot is the review-visible half. `-ss` omits *blanket* impls
      # (`impl<T> Into<T> for T` and friends, which drag every transitive
      # dependency's name into the file) and auto-trait impls, and keeps
      # everything else — including the derived `Debug`/`Clone` impls, losing
      # which is a breaking change.
      #
      # `--simplified`'s full form (`-sss`) is deliberately **not** used: it
      # would also drop the module paths, and a type moving between modules is
      # exactly the kind of change a consumer has to adapt to.
      #
      # Regenerate with the same command and commit the result in the same
      # commit as the change that caused it.
      - name: The public API must match the committed snapshot
        run: |
          cargo public-api --manifest-path crates/sdk/Cargo.toml -ss > /tmp/public-api.txt
          diff -u crates/sdk/public-api.txt /tmp/public-api.txt

      # The baseline is the last revision that actually contained the crate. On
      # the first revision that does, there is nothing to compare against, and
      # saying so is the honest outcome — a silently-skipped step and a
      # passing step look identical in a log.
      - name: Find the last revision that had crates/sdk
        id: baseline
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"

          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            echo "rev=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git cat-file -e "${base}:crates/sdk/Cargo.toml" 2>/dev/null; then
            echo "rev=${base}" >> "$GITHUB_OUTPUT"
          else
            echo "rev=" >> "$GITHUB_OUTPUT"
            echo "::notice::$base predates crates/sdk, so there is no baseline to compare against."
          fi

      # `-p vilsend-sdk` is load-bearing, not tidiness. `vilsend-sdk` is
      # `publish = false` (ADR-0005), and cargo-semver-checks **silently skips
      # an unpublished workspace member that was not explicitly selected**: it
      # prints `Skipping vilsend-sdk v0.1.0 (current)` and exits 0 having
      # checked nothing. Selecting the package is what stops that, and the
      # assertion below is what turns a skip back into a failure — because a
      # skipped step and a passing step look identical in a log, which is the
      # exact failure mode rule 7 is about.
      #
      # Verified locally both ways: without `-p`, the output is
      # `Skipping vilsend-sdk v0.1.0 (current)` and there is no summary line;
      # with it, `196 checks: 196 pass, 58 skip`.
      - name: Semver compatibility against the baseline
        if: steps.baseline.outputs.rev != ''
        run: |
          set -o pipefail

          cargo semver-checks check-release \
            -p vilsend-sdk \
            --manifest-path crates/sdk/Cargo.toml \
            --baseline-rev "${{ steps.baseline.outputs.rev }}" | tee /tmp/semver.txt

          if ! grep -q 'Summary ' /tmp/semver.txt; then
            echo "::error::cargo-semver-checks printed no summary — it checked nothing."
            echo "The usual cause is a missing \`-p vilsend-sdk\`: see the comment above."
            exit 1
          fi

      - name: No baseline to check against (first revision with the crate)
        if: steps.baseline.outputs.rev == ''
        run: |
          echo "::notice::cargo-semver-checks was not run: crates/sdk does not exist at the baseline."
          echo "This is expected on the revision that introduces the crate, and only on it."

[package]
name = "vilsend-core"
# Not shipped on its own yet: Phase 2 only establishes the crate and proves the
# dependency direction. It is versioned apart from the desktop app because the
# desktop app's version is the updater's version, and this crate has no
# installer.
version = "0.1.0"
edition = "2021"
description = "Platform-agnostic domain types, ports and error model for VilSend."
license = "Apache-2.0 OR MIT"
publish = false

# ADR-0002 rule 1: `vilsend-core` depends on nothing but `serde`, `thiserror`,
# `async-trait`, `bytes`, `futures-core` and `tracing`. Adding an edge here
# needs an ADR.
#
# Phase 8 (the transport port) is the first code to use two of the four that
# were reserved but unused: `async-trait` and `bytes`, for the port's own shape.
# No new edge is introduced, so no ADR is needed.
#
# `futures-core` and `tracing` are still unused and still not declared. The
# port's tests drive their futures with `std::task::Wake`, which is stable and
# needs nothing — so the reserved allowance for an async helper crate turned out
# not to be needed, and a dependency that is written down and not used is a
# claim the manifest cannot support.
[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
async-trait = "0.1"
bytes = "1"

[dev-dependencies]
# Tests only: the golden payload fixtures are JSON files compared byte for byte.
serde_json = "1"

# Every new wire behaviour ships behind a flag that is off for one release
# (`05-migration-plan.md`, cross-phase concerns). This one is **not** in
# `default`: it is what raises `PROTOCOL_VERSION` to v2, and a default build
# must claim v1 or the installed base breaks. The desktop crate forwards to it
# so that one flag turns the whole v2 path on.
[features]
default = []
protocol-v2 = []
